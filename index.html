<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automobili Papallo | Scegli la tua prossima auto</title>
  <meta name="description" content="Entra nel mondo Automobili Papallo: scegli tra auto nuove, auto usate e soluzioni di noleggio.">
  <meta name="theme-color" content="#031b46">
  <link rel="stylesheet" href="landing.css">
</head>
<body class="portal-page">
  <a class="portal-skip" href="#scelta">Vai alle soluzioni</a>

  <main class="portal-shell">
    <div class="portal-glow portal-glow--one" aria-hidden="true"></div>
    <div class="portal-glow portal-glow--two" aria-hidden="true"></div>

    <header class="portal-brand" aria-labelledby="portal-title">
      <img src="assets/logo-papallo-blu-final-2026.png" alt="Automobili Papallo, dal 1976 vicino a chi guida">
      <div class="portal-intro">
        <p>Il tuo prossimo viaggio inizia da qui</p>
        <h1 id="portal-title">Scegli la strada<br>più adatta a te.</h1>
      </div>
    </header>

    <nav class="portal-options" id="scelta" aria-label="Scegli la tipologia di auto">
      <a class="portal-option portal-option--new" href="nuove.html">
        <span class="portal-option-number">01</span>
        <span class="portal-option-state">In arrivo</span>
        <span class="portal-option-copy">
          <small>Scopri il futuro</small>
          <strong>Auto<br>nuove</strong>
        </span>
        <span class="portal-option-action" aria-hidden="true">↗</span>
      </a>

      <a class="portal-option portal-option--used" href="usate.html">
        <span class="portal-option-number">02</span>
        <span class="portal-option-state">In arrivo</span>
        <span class="portal-option-copy">
          <small>Qualità selezionata</small>
          <strong>Auto<br>usate</strong>
        </span>
        <span class="portal-option-action" aria-hidden="true">↗</span>
      </a>

      <a class="portal-option portal-option--rental" href="noleggio.html">
        <span class="portal-option-number">03</span>
        <span class="portal-option-state portal-option-state--live">Esplora ora</span>
        <span class="portal-option-copy">
          <small>Mobilità su misura</small>
          <strong>Auto a<br>noleggio</strong>
        </span>
        <span class="portal-option-action" aria-hidden="true">→</span>
      </a>
    </nav>

    <footer class="portal-footer">
      <span>Automobili Papallo</span>
      <p>Dal 1976, vicino a chi guida.</p>
    </footer>
  </main>
</body>
</html>
